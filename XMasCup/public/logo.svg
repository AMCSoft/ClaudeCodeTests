<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 240 262" role="img" aria-label="Fanum Fortunae XMas Cup: ghirlanda natalizia con due spade incrociate, fiocco rosso e stella cometa">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#1d3b6b"/>
      <stop offset="1" stop-color="#0a1630"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="0.5" stop-color="#b9c4d4"/>
      <stop offset="1" stop-color="#6d7a8f"/>
    </linearGradient>
    <radialGradient id="guard" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.6" stop-color="#e3b341"/>
      <stop offset="1" stop-color="#9c6d12"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset="1" stop-color="#e0a526"/>
    </linearGradient>
    <g id="leaf">
      <path d="M0 0 C 6 -10 18 -12 26 -6 C 22 -2 24 4 20 6 C 14 4 10 8 6 6 C 4 2 0 2 0 0 Z" fill="#1f7a3e" stroke="#0f4a24" stroke-width="1.2"/>
      <path d="M2 0 C 10 -2 16 -3 24 -5" stroke="#5fbf6e" stroke-width="1" fill="none"/>
    </g>
    <g id="berry">
      <circle r="5.5" fill="#d7263d"/>
      <circle cx="-1.8" cy="-1.8" r="1.6" fill="#ff9aa8"/>
    </g>
  </defs>

  <circle cx="120" cy="124" r="104" fill="url(#bg)"/>

  <!-- neve sul medaglione -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="70" cy="70" r="2"/><circle cx="168" cy="62" r="1.6"/><circle cx="186" cy="110" r="2.2"/>
    <circle cx="54" cy="128" r="1.6"/><circle cx="96" cy="48" r="1.4"/><circle cx="150" cy="178" r="1.6"/>
    <circle cx="82" cy="176" r="2"/><circle cx="120" cy="96" r="1.3"/>
  </g>

  <!-- spade incrociate (lama triangolare, coccia a campana, impugnatura) -->
  <g>
    <g transform="rotate(-42 120 124)">
      <rect x="117.5" y="30" width="5" height="118" rx="2" fill="url(#blade)"/>
      <circle cx="120" cy="30" r="3" fill="#6d7a8f"/>
      <ellipse cx="120" cy="152" rx="20" ry="7" fill="url(#guard)" stroke="#7a520c" stroke-width="1.5"/>
      <rect x="115.5" y="157" width="9" height="28" rx="3" fill="#7a1420"/>
      <path d="M115.5 163 h9 M115.5 170 h9 M115.5 177 h9" stroke="#e3b341" stroke-width="1.2"/>
      <circle cx="120" cy="189" r="6" fill="url(#guard)" stroke="#7a520c" stroke-width="1.2"/>
    </g>
    <g transform="rotate(42 120 124)">
      <rect x="117.5" y="30" width="5" height="118" rx="2" fill="url(#blade)"/>
      <circle cx="120" cy="30" r="3" fill="#6d7a8f"/>
      <ellipse cx="120" cy="152" rx="20" ry="7" fill="url(#guard)" stroke="#7a520c" stroke-width="1.5"/>
      <rect x="115.5" y="157" width="9" height="28" rx="3" fill="#7a1420"/>
      <path d="M115.5 163 h9 M115.5 170 h9 M115.5 177 h9" stroke="#e3b341" stroke-width="1.2"/>
      <circle cx="120" cy="189" r="6" fill="url(#guard)" stroke="#7a520c" stroke-width="1.2"/>
    </g>
  </g>

  <!-- ghirlanda di agrifoglio -->
  <circle cx="120" cy="124" r="100" fill="none" stroke="#14532d" stroke-width="16"/>
  <g>
    <use href="#leaf" transform="translate(120 24) rotate(0)"/>
    <use href="#leaf" transform="translate(171 38) rotate(30)"/>
    <use href="#leaf" transform="translate(207 74) rotate(60)"/>
    <use href="#leaf" transform="translate(220 124) rotate(90)"/>
    <use href="#leaf" transform="translate(207 174) rotate(120)"/>
    <use href="#leaf" transform="translate(171 210) rotate(150)"/>
    <use href="#leaf" transform="translate(69 210) rotate(210)"/>
    <use href="#leaf" transform="translate(33 174) rotate(240)"/>
    <use href="#leaf" transform="translate(20 124) rotate(270)"/>
    <use href="#leaf" transform="translate(33 74) rotate(300)"/>
    <use href="#leaf" transform="translate(69 38) rotate(330)"/>
    <use href="#leaf" transform="translate(146 28) rotate(195)"/>
    <use href="#leaf" transform="translate(192 54) rotate(225)"/>
    <use href="#leaf" transform="translate(217 98) rotate(255)"/>
    <use href="#leaf" transform="translate(217 150) rotate(285)"/>
    <use href="#leaf" transform="translate(192 194) rotate(315)"/>
    <use href="#leaf" transform="translate(48 194) rotate(45)"/>
    <use href="#leaf" transform="translate(23 150) rotate(75)"/>
    <use href="#leaf" transform="translate(23 98) rotate(105)"/>
    <use href="#leaf" transform="translate(48 54) rotate(135)"/>
    <use href="#leaf" transform="translate(94 28) rotate(165)"/>
  </g>
  <g>
    <use href="#berry" transform="translate(146 30)"/><use href="#berry" transform="translate(154 36)"/>
    <use href="#berry" transform="translate(213 100)"/><use href="#berry" transform="translate(218 110)"/>
    <use href="#berry" transform="translate(196 190)"/><use href="#berry" transform="translate(186 198)"/>
    <use href="#berry" transform="translate(26 146)"/><use href="#berry" transform="translate(24 136)"/>
    <use href="#berry" transform="translate(48 58)"/><use href="#berry" transform="translate(56 50)"/>
  </g>

  <!-- fiocco rosso in basso -->
  <g transform="translate(120 222)">
    <path d="M-4 0 L-22 26 L-12 24 L-8 34 L0 6 Z" fill="#a3122a"/>
    <path d="M4 0 L22 26 L12 24 L8 34 L0 6 Z" fill="#a3122a"/>
    <path d="M0 0 C -18 -20 -38 -14 -34 -2 C -30 10 -12 6 0 0 Z" fill="#d7263d" stroke="#8a0f22" stroke-width="1.5"/>
    <path d="M0 0 C 18 -20 38 -14 34 -2 C 30 10 12 6 0 0 Z" fill="#d7263d" stroke="#8a0f22" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="7" ry="6" fill="#ef3e55" stroke="#8a0f22" stroke-width="1.5"/>
  </g>

  <!-- stella cometa in cima -->
  <g transform="translate(120 18)">
    <path d="M0 -17 L5 -5 L18 -5 L8 3 L12 16 L0 8 L-12 16 L-8 3 L-18 -5 L-5 -5 Z" fill="url(#gold)" stroke="#a8740e" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
